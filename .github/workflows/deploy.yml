name: Build and Deploy Vite to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created"
            exit 1
          fi

          echo "Build successful."
          du -sh dist
          find dist -maxdepth 2 -type f | head -50

      - name: Deploy dist to cPanel
        run: |
          echo "Deploying Vite dist/ to cPanel..."

          rsync -avz --delete \
            -e "ssh -p ${{ secrets.CPANEL_PORT }} -o StrictHostKeyChecking=no" \
            dist/ \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_PATH }}/"

          echo "Deployment completed successfully."